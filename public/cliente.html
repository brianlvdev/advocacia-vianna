<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="img/logo.png">
<meta name="robots" content="noindex,nofollow"><title>Área do cliente | Advocacia Vianna</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/painel.css"></head><body>
<header class="topo"><a href="index.html" class="marca"><img src="img/logo.png" alt="Advocacia Vianna"></a><nav><a href="index.html">Ver site</a><button id="btn-sair" class="btn" type="button">Sair</button></nav></header>
<main class="painel">
<p class="sobretitulo">ÁREA RESTRITA</p><h1>Minha área</h1><p id="boas-vindas"></p>
<section class="painel-secao"><h2>Minhas reuniões</h2><div id="lista-reunioes" class="lista-casos"></div><a class="btn" id="btn-agendar" href="agendar.html">Solicitar horário</a></section>
<section class="painel-secao"><h2>Envie sua solicitação</h2><p>O envio não constitui contratação ou aceitação do patrocínio jurídico.</p>
<form id="form-caso">
<label>Área de atendimento<select id="assunto" required><option>Direito Civil</option><option>Direito de Família</option><option>Direito Penal</option><option>Direito Penal Econômico</option><option>Outro</option></select></label>
<label>Resumo do caso<textarea id="resumo" minlength="10" maxlength="8000" required placeholder="Descreva sua solicitação de maneira objetiva"></textarea></label>
<label>Documentos (até 8 arquivos de 10 MB cada: PDF, TXT, JPG, PNG, WEBP)<input id="arquivos" type="file" multiple accept=".pdf,.txt,.jpg,.jpeg,.png,.webp"></label>
<label class="consentimento"><input type="checkbox" id="consentimento" required><span>Li as <a href="privacidade.html" target="_blank" rel="noopener noreferrer">informações de privacidade</a> e estou ciente do tratamento de dados necessário à análise do pedido.</span></label>
<button class="btn" type="submit">Enviar solicitação</button><p id="aviso" role="status" aria-live="polite" class="aviso"></p>
</form></section>
<section class="painel-secao"><h2>Meus envios</h2><div id="lista-casos" class="lista-casos"></div></section>
</main><script type="module" src="js/cliente.js"></script></body></html>
