<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Área do cliente | Advocacia Vianna</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/painel.css">
</head>
<body>
  <header class="topo">
    <a href="index.html" class="marca"><img src="img/logo.png" alt="Advocacia Vianna"></a>
    <nav><a href="index.html">Ver site</a><button id="btn-sair" class="btn">Sair</button></nav>
  </header>
  <main class="painel">
    <p class="sobretitulo">Área restrita</p>
    <h1>Minha área</h1>
    <p id="boas-vindas"></p>
    <section class="painel-secao">
      <h2>Minhas reuniões</h2>
      <div id="lista-reunioes" class="lista-casos"></div>
      <a class="btn" id="btn-agendar" href="agendar.html">Solicitar horário</a>
    </section>
    <section class="painel-secao">
      <h2>Conte seu caso</h2>
      <p>Este formulário não substitui consulta jurídica e o envio não implica aceitação de patrocínio.</p>
      <form id="form-caso">
        <label>Assunto
          <select id="assunto">
            <option>Direito Penal</option><option>Direito de Família</option>
            <option>Direito Civil</option><option>Direito Penal Econômico</option><option>Outro</option>
          </select>
        </label>
        <label>Descrição resumida do caso
          <textarea id="resumo" required minlength="10" maxlength="8000"></textarea>
        </label>
        <label>Documentos (até 8 arquivos; PDF, TXT, JPEG, PNG ou WEBP; até 10 MB cada)
          <input type="file" id="arquivos" multiple accept=".pdf,.txt,.jpg,.jpeg,.png,.webp">
        </label>
        <label class="consentimento">
          <input type="checkbox" id="consentimento" required>
          <span>Li a <a href="privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a> e estou ciente do tratamento de dados para análise da solicitação.</span>
        </label>
        <button class="btn" type="submit">Enviar solicitação</button>
        <p id="aviso" class="aviso" role="status" aria-live="polite"></p>
      </form>
    </section>
    <section class="painel-secao">
      <h2>Meus envios</h2>
      <div id="lista-casos" class="lista-casos"></div>
    </section>
  </main>
  <script type="module" src="js/cliente.js"></script>
</body>
</html>
